# Releases land on main (Gitflow). Each one builds both images, pushes them to GitHub
# Container Registry, and, once the Azure variables are set, rolls them out: the API,
# then n8n, then the job that imports and publishes the workflows. Sign-in uses
# OpenID Connect: no stored secret.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  images:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: tag
        run: echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Build and push
        env:
          OWNER: ${{ github.repository_owner }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          repo="ghcr.io/${OWNER,,}"
          docker buildx build --push -t "$repo/leadloom-api:$TAG" -t "$repo/leadloom-api:latest" .
          docker buildx build --push -t "$repo/leadloom-n8n:$TAG" -t "$repo/leadloom-n8n:latest" n8n

  azure:
    needs: images
    if: vars.AZURE_CLIENT_ID != ''
    runs-on: ubuntu-latest
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Roll out the new images
        env:
          RG: ${{ vars.AZURE_RESOURCE_GROUP }}
          API: ${{ vars.AZURE_API_APP }}
          N8N: ${{ vars.AZURE_N8N_APP }}
          JOB: ${{ vars.AZURE_N8N_SETUP_JOB }}
          OWNER: ${{ github.repository_owner }}
          TAG: ${{ needs.images.outputs.tag }}
        run: |
          repo="ghcr.io/${OWNER,,}"
          az extension add --name containerapp --upgrade --only-show-errors
          az containerapp update -g "$RG" -n "$API" --image "$repo/leadloom-api:$TAG" --output none
          # Waking the API applies its schema, including the empty one n8n needs.
          api="https://$(az containerapp show -g "$RG" -n "$API" --query properties.configuration.ingress.fqdn -o tsv)"
          curl -fsS --retry 12 --retry-delay 10 --retry-all-errors "$api/health"
          az containerapp update -g "$RG" -n "$N8N" --image "$repo/leadloom-n8n:$TAG" --output none
          az containerapp job update -g "$RG" -n "$JOB" --image "$repo/leadloom-n8n:$TAG" --output none
          run=$(az containerapp job start -g "$RG" -n "$JOB" --query name -o tsv)
          # Up to 30 minutes: the first run migrates a fresh n8n database.
          for i in $(seq 1 180); do
            status=$(az containerapp job execution show -g "$RG" -n "$JOB" --job-execution-name "$run" --query properties.status -o tsv)
            echo "workflow setup: $status"
            [ "$status" = "Succeeded" ] && break
            [ "$status" = "Failed" ] && exit 1
            sleep 10
          done
          [ "$status" = "Succeeded" ]
          echo "API: $api"
          echo "n8n: https://$(az containerapp show -g "$RG" -n "$N8N" --query properties.configuration.ingress.fqdn -o tsv)"
