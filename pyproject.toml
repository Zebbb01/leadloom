[project]
name = "leadloom"
version = "0.4.1"
description = "AI lead intake and CRM automation: n8n receives leads from a website form, inbound email and bookings; a FastAPI service dedupes, enriches, scores and routes them and syncs HubSpot."
readme = "README.md"
# pgserver (the embedded PostgreSQL the tests use) ships wheels up to Python 3.12.
requires-python = "~=3.12.0"
dependencies = [
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "psycopg[binary]>=3.3.6",
    "psycopg-pool>=3.3.3",
    "python-multipart>=0.0.33",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pgserver>=0.1.4",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S107"]
"scripts/*" = ["S603", "S607"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Starlette 1.x nudges TestClient users towards httpx2; httpx is what the app uses.
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]

[tool.mypy]
files = ["app"]
ignore_missing_imports = true
check_untyped_defs = true
