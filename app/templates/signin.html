{% extends "base.html" %}
{% block title %}Reviewer sign-in · LeadLoom{% endblock %}
{% block main %}
<div class="narrow">
  <h1>Reviewer sign-in</h1>
  <p class="muted">Reviewers see every lead, including live ones. Without a key you see only the samples you sent.</p>
  {% if error %}<p class="notice notice-bad" role="alert" style="margin-top:16px"><svg class="icon"><use href="#i-alert"/></svg><span>{{ error }}</span></p>{% endif %}
  <form method="post" action="/signin" data-busy>
    <div>
      <label for="key">Reviewer key</label>
      <input id="key" name="key" type="password" autocomplete="current-password" required>
    </div>
    <div class="actions">
      <button class="btn btn-primary" type="submit" data-busy-label="Signing in…"><span class="spinner" aria-hidden="true"></span><span class="label-text">Sign in</span></button>
      <a class="btn btn-quiet" href="/">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
